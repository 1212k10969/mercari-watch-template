name: Monitor clock
run-name: ${{ inputs.bootstrap && 'Cloud clock verification' || format('Cloud clock after {0}', inputs.previous_run_id || 'manual start') }}
on:
  workflow_dispatch:
    inputs:
      bootstrap:
        description: Verify one automatic handoff with a one-minute timer; following cycles use thirty minutes
        type: boolean
        default: false
      previous_run_id:
        description: Parent clock run, populated automatically
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: mercari-monitor-clock
  cancel-in-progress: false
jobs:
  validate:
    if: vars.MONITOR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require the configured server-side timer
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TIMER_ENVIRONMENT: ${{ inputs.bootstrap && 'monitor-clock-bootstrap' || 'monitor-clock-30m' }}
          EXPECTED_WAIT: ${{ inputs.bootstrap && '1' || '30' }}
        run: |
          gh api "repos/$REPOSITORY/environments/$TIMER_ENVIRONMENT" > timer.json
          python - <<'PY'
          import json, os
          with open('timer.json', encoding='utf-8') as source:
              rules = json.load(source).get('protection_rules', [])
          waits = [r.get('wait_timer') for r in rules if r.get('type') == 'wait_timer']
          if waits != [int(os.environ['EXPECTED_WAIT'])] or any(r.get('type') == 'required_reviewers' for r in rules):
              raise SystemExit('Configure the expected wait timer without required reviewers before starting the clock.')
          print('Verified cloud timer:', os.environ['EXPECTED_WAIT'], 'minutes')
          PY
  monitor:
    needs: validate
    if: vars.MONITOR_ENABLED == 'true' && !inputs.bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: write
    steps:
      - name: Start market monitor
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          for attempt in 1 2 3; do
            if gh workflow run market-monitor.yml --repo "$REPOSITORY" --ref main -f source=all -f clock_run_id="$GITHUB_RUN_ID"; then
              exit 0
            fi
            sleep 10
          done
          exit 1
  next:
    needs: validate
    if: vars.MONITOR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      actions: write
    environment:
      name: ${{ inputs.bootstrap && 'monitor-clock-bootstrap' || 'monitor-clock-30m' }}
    steps:
      - name: Start next clock after the server-side timer
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          for attempt in 1 2 3; do
            if gh workflow run monitor-clock.yml --repo "$REPOSITORY" --ref main -f bootstrap=false -f previous_run_id="$GITHUB_RUN_ID"; then
              exit 0
            fi
            sleep 10
          done
          exit 1
  report_failure:
    needs: [validate, monitor, next]
    if: always() && (needs.validate.result == 'failure' || needs.monitor.result == 'failure' || needs.next.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Report clock failure
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL_SECONDARY: ${{ secrets.DISCORD_WEBHOOK_URL_SECONDARY }}
          DISCORD_WEBHOOK_URL_TERTIARY: ${{ secrets.DISCORD_WEBHOOK_URL_TERTIARY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BOOTSTRAP: ${{ inputs.bootstrap }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          prefix = '【測試】' if os.environ.get('BOOTSTRAP') == 'true' else ''
          text = prefix + '⚠️【排程異常】雲端計時設定或啟動監聽失敗，請查看執行紀錄：' + os.environ['RUN_URL']
          payload = json.dumps({'content': text, 'allowed_mentions': {'parse': []}}).encode()
          for key in ('DISCORD_WEBHOOK_URL', 'DISCORD_WEBHOOK_URL_SECONDARY', 'DISCORD_WEBHOOK_URL_TERTIARY'):
              webhook = os.environ.get(key, '').strip()
              if not webhook:
                  continue
              try:
                  request = urllib.request.Request(webhook, data=payload, headers={
                      'Content-Type': 'application/json',
                      'User-Agent': 'DiscordBot (https://github.com/danny0926/mercari-watch-template, 0.4.2)',
                  })
                  with urllib.request.urlopen(request, timeout=15):
                      pass
              except Exception:
                  print('Clock alert delivery failed; inspect this workflow run.')
          PY
