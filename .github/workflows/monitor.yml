name: Mercari monitor
on:
  workflow_dispatch:
    inputs:
      test_line:
        description: 發送一則純文字 LINE 連線測試
        type: boolean
        default: false
  schedule:
    - cron: '7,37 * * * *'
permissions:
  contents: read
concurrency:
  group: mercari-monitor
  cancel-in-progress: false
jobs:
  monitor:
    if: github.event_name == 'workflow_dispatch' || vars.MONITOR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest -q
      - name: Check once
        if: ${{ !inputs.test_line }}
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python mercari_watch.py --once
      - name: Test LINE
        if: ${{ inputs.test_line }}
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python mercari_watch.py --test-line
      - name: Save state
        if: ${{ always() && !inputs.test_line }}
        run: |
          if [ -f seen.json ]; then
            git add -f seen.json
            if ! git diff --cached --quiet; then
              git -c user.name='github-actions[bot]' -c user.email='41898313+github-actions[bot]@users.noreply.github.com' commit -m 'Update monitor state [skip ci]'
              git pull --rebase origin "$GITHUB_REF_NAME"
              git push origin "HEAD:$GITHUB_REF_NAME"
            fi
          fi

